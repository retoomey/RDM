# ==============================================================================
# Comprehensive LDM ldmd.conf Parser Validation Suite
# Built against: https://docs.unidata.ucar.edu/ldm/current/basics/ldmd.conf.html
#
# ldmd.conf has exactly FIVE entry types: EXEC, REQUEST, ALLOW, ACCEPT, INCLUDE.
# Unlike pqact.conf, the spec here does not define a strict "TAB" field
# separator -- entries are whitespace-delimited tokens, and real-world
# ldmd.conf files commonly use plain spaces (single or multiple) rather than
# tabs. This suite therefore exercises both spacing styles throughout.
# ==============================================================================


# ------------------------------------------------------------------------------
# SECTION 1: EXEC Entries
# Syntax: EXEC "command"
# Quotation marks are MANDATORY if command contains whitespace. Internal
# quotes are escaped with a backslash (\"). Each PAIR of backslashes in the
# command collapses to a single backslash.
# ------------------------------------------------------------------------------

# 1.1 Standard quoted command with arguments (the overwhelmingly common case)
EXEC "pqact"

# 1.2 Quoted command with multiple flags/arguments
EXEC "pqact -f DDPLUS etc/pqactb.conf"

# 1.3 Quoted command with an internal escaped double-quote
EXEC "rtstats -h rtstats.unidata.ucar.edu -m \"latency check\""

# 1.4 Quoted command containing an escaped backslash pair (\\ -> \)
EXEC "pqsurf -p ^(S[AP]) -d C:\\data\\surface -Q /usr/local/ldm/data/pqsurf.pq"

# 1.5 Single-token command with no embedded whitespace -- quoting still used
# by convention, but this tests the boundary case of a minimal command
EXEC "pqact"

# 1.6 EXEC with extra inter-token spacing (space-delimited, not tab-delimited)
EXEC     "rtstats -f ANY -h rtstats.unidata.ucar.edu"


# ------------------------------------------------------------------------------
# SECTION 2: REQUEST Entries
# Syntax: REQUEST <feedtype> <prodIdEre> <hostId>[:<port>]
# prodIdEre must be quoted if it contains whitespace; internal quotes are
# backslash-escaped exactly as in EXEC commands.
# ------------------------------------------------------------------------------

# 2.1 Basic request, default port, unquoted pattern with no whitespace
REQUEST ANY ".*" idd.unidata.ucar.edu

# 2.2 Request with an explicit non-default port
REQUEST ANY ".*" idd.unidata.ucar.edu:388

# 2.3 Request to an IP address in dotted-quad form instead of a hostname
REQUEST IDS|DDPLUS ".*" 128.117.140.35

# 2.4 Primary/alternate transfer-mode pair: identical feedtype+pattern
# requested from two different hosts. First entry = primary transfer-mode,
# second entry = alternate transfer-mode.
REQUEST NEXRAD3 ".*" idd1.example.edu       # initially primary-mode
REQUEST NEXRAD3 ".*" idd2.example.edu       # initially alternate-mode

# 2.5 Feedtype union (bitwise-OR of feedtypes)
REQUEST IDS|DDPLUS|HDS ".*" idd.unidata.ucar.edu

# 2.6 Feedtype subtraction/exclusion
REQUEST ANY-EXP-SPARE ".*" idd.unidata.ucar.edu

# 2.7 Numeric feedtype (doc example key explicitly lists "3" as valid)
REQUEST 3 ".*" idd.unidata.ucar.edu

# 2.8 Quoted prodIdEre containing whitespace (mandatory quoting case)
REQUEST WMO "^SA (KWBC|KKCI) [0-9]{6}" idd.unidata.ucar.edu

# 2.9 Quoted prodIdEre with an internal escaped quote
REQUEST WMO "^TITLE \"SPECIAL\" PRODUCT" idd.unidata.ucar.edu

# 2.10 Narrowly-scoped ERE anchored pattern, default (no) port
REQUEST NGRID "^gfs\.t[0-9]{2}z" nomads.example.edu


# ------------------------------------------------------------------------------
# SECTION 3: ALLOW Entries
# Syntax: ALLOW <feedtype> <hostIdEre> [<OK_pattern> [<NOT_pattern>]]
# hostIdEre must NOT contain whitespace and must NOT be quoted, even though
# OK_pattern/NOT_pattern CAN be quoted if they contain whitespace.
# ------------------------------------------------------------------------------

# 3.1 Minimal form: feedtype + hostIdEre only (OK_pattern defaults to ".*")
ALLOW ANY ^ldm\.downstream\.site$

# 3.2 With an explicit OK_pattern (3-field form)
ALLOW ANY ^ldm\.downstream\.site$ .*

# 3.3 Full 4-field form: feedtype, hostIdEre, OK_pattern, NOT_pattern
# (allow everything except products beginning with "TEST")
ALLOW ANY ^ldm\.downstream\.site$ .* ^TEST

# 3.4 The two boilerplate entries every ldmd.conf should contain
ALLOW   ANY ^(localhost|loopback)|(127\.0\.0\.1\.?$)
ALLOW   ANY ^([a-z].*\.unidata\.ucar\.edu\.?$)

# 3.5 Restricted feedtype + host pattern matching a whole subdomain
ALLOW IDS|DDPLUS ^.*\.university\.edu$

# 3.6 OK_pattern quoted because it contains whitespace
ALLOW WMO ^partner\.example\.edu$ "^SA (KWBC|KKCI)"

# 3.7 Feedtype subtraction combined with a host ERE alternation
ALLOW ANY-SPARE ^(hosta|hostb)\.example\.edu$


# ------------------------------------------------------------------------------
# SECTION 4: ACCEPT Entries
# Syntax: ACCEPT <feedtype> <prodIdEre> <hostIdEre>
# NOTE the field order differs from ALLOW: prodIdEre comes BEFORE hostIdEre
# here, whereas ALLOW has no prodIdEre field at all (it has OK/NOT instead).
# ------------------------------------------------------------------------------

# 4.1 Classic use case: accepting unrequested rtstats statistics products
ACCEPT EXP "^rtstats" stats-collector.unidata.ucar.edu

# 4.2 Accepting from a host ERE (multiple hosts via alternation)
ACCEPT ANY ".*" ^(wsi1|wsi2)\.example\.com$

# 4.3 Quoted prodIdEre containing whitespace
ACCEPT WMO "^SA (KWBC|KKCI) [0-9]{6}" upstream.example.edu

# 4.4 Feedtype union in an ACCEPT entry
ACCEPT IDS|DDPLUS ".*" legacy-feed.example.edu


# ------------------------------------------------------------------------------
# SECTION 5: INCLUDE Entries
# Syntax: INCLUDE pathname   |   INCLUDE "pathname with spaces"
# A non-absolute pathname is relative to the directory containing the
# configuration-file currently being processed.
# ------------------------------------------------------------------------------

# 5.1 Absolute pathname, unquoted (no whitespace in the path)
INCLUDE /usr/local/ldm/etc/ldmd.gateway.conf

# 5.2 Relative pathname, unquoted -- resolved relative to this file's directory
INCLUDE ldmd.requests.conf

# 5.3 Quoted pathname containing whitespace
INCLUDE "/usr/local/ldm/etc/site configs/ldmd.extra.conf"

# 5.4 Relative quoted pathname with whitespace
INCLUDE "extra configs/ldmd.local.conf"


# ------------------------------------------------------------------------------
# SECTION 6: Formatting Edge Cases
# ------------------------------------------------------------------------------

# 6.1 Space-delimited (single space) vs. multi-space-delimited entries --
# ldmd.conf has no documented TAB requirement like pqact.conf, so both should
# parse identically.
REQUEST ANY ".*" single-space.example.edu
REQUEST     ANY      ".*"      multi-space.example.edu

# 6.2 Leading whitespace / indentation before an entry keyword
    EXEC "pqact -v"
	REQUEST ANY ".*" tab-indented.example.edu

# 6.3 Trailing whitespace after the final field
ALLOW ANY ^trailing\.whitespace\.example\.edu$    

# 6.4 Blank lines and a comment-only line interspersed (comments begin with #)

# This is a standalone comment line with nothing else on it
REQUEST ANY ".*" after-comment.example.edu

# 6.5 Trailing inline comment after a real entry (common in practice, though
# not part of the formal grammar shown in the docs -- worth flagging if your
# parser treats everything after the last field, rather than only a
# line-initial #, as a comment)
REQUEST ANY ".*" inline-comment.example.edu   # requesting everything
