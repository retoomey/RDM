# ==============================================================================
# Comprehensive RDM pqact.conf Parser Validation Suite 
#
# We have a -n option on lpqact to test a pqact.conf (modeled on ldmd/rdmd -n)
#
# lpqact -n rdmpqact.conf
#
# Based on docs at:
#   https://docs.unidata.ucar.edu/ldm/current/basics/pqact.conf.html
# Added spaced vs tabbed examples, so basically rdm's parsing is less strict.
# ==============================================================================

# ------------------------------------------------------------------------------
# SECTION 1: Standard Tab-Delimited Syntax (Strict LDM Standard)
# Fields MUST be tab-separated: Feedtype <tab> Pattern <tab> Action <tab> Args
# ------------------------------------------------------------------------------

# 1.1 FILE Action with all documented flags, including -metadata
EXP	^WMO_([A-Z4-9]{4})_([0-9]{6})\.txt$	FILE	-overwrite -flush -strip -log -metadata /tmp/data/\1/\2.txt

# 1.1b FILE with -close instead of -flush (flags are documented as alternatives: [-flush|-close])
EXP	^WMO_CLOSE_([A-Z4-9]{4})\.txt$	FILE	-overwrite -close -strip -log /tmp/data/\1_close.txt

# 1.1c FILE with -flush only, no -close (default behavior: file stays open)
EXP	^WMO_FLUSHONLY_([A-Z4-9]{4})\.txt$	FILE	-flush /tmp/data/\1_flushonly.txt

# 1.2 STDIOFILE Action (buffered fwrite). Same flags as FILE except NO -metadata.
IDS|DDPLUS	^SAUS41 (....) ([0-9]{6})	STDIOFILE	-overwrite -flush -strip -log /tmp/stdio_output.log

# 1.2b STDIOFILE with -close variant
IDS|DDPLUS	^SAUS42 (....) ([0-9]{6})	STDIOFILE	-close /tmp/stdio_output_close.log

# 1.3 PIPE Action with all documented flags: [-strip] [-flush|-close] [-metadata]
HDS	^SA.*	PIPE	-strip -flush -metadata /usr/local/bin/process_surface_obs -v

# 1.3b PIPE with -close instead of -flush
HDS	^SP.*	PIPE	-strip -close /usr/local/bin/process_surface_obs_close -v

# 1.4 EXEC Action, no flags (child process, no stdin piping)
ANY	^NOTIFY_.*	EXEC	/usr/local/bin/alert_handler.sh \1

# 1.4b EXEC Action with the ONLY documented flag: -wait
# (pqact suspends itself until the child terminates before continuing)
ANY	^NOTIFY_SYNC_.*	EXEC	-wait /usr/local/bin/alert_handler_sync.sh \1

# 1.5 DBFILE Action (store product in a gdbm database) - pathname only
NEXRAD	^RADAR_(...)_(.*)$	DBFILE	/var/db/radar/\1/\2.db

# 1.5b DBFILE Action with the optional [key] argument
NEXRAD	^RADARKEY_(...)_(.*)$	DBFILE	/var/db/radar/keyed.db \2

# 1.6 NOOP Action (no-operation, used to match and discard/consume)
SPARE|NGRID	^DROP_ME_.*	NOOP

# 1.7 FILE Action using strict double quotes and single-digit substitution
NMC2	^(.*)$	FILE	-overwrite "/var/data/raw/\1"

# 1.8 Two-digit subexpression reference \(12) for prodIdPat with >9 groups
WMO	^(a)(b)(c)(d)(e)(f)(g)(h)(i)(j)(k)(l)$	FILE	-overwrite /tmp/twodigit/\(10)_\(11)_\(12).dat

# 1.9 The special ^_ELSE_$ prodIdPat: fires if nothing has claimed the product yet
# and the first character of the identifier is not an underscore.
ANY	^_ELSE_$	FILE	-log /tmp/catchall/unmatched.dat


# ------------------------------------------------------------------------------
# SECTION 2: Space-Delimited Syntax (Modern/Relaxed Parser Testing)
# Standard LDM rejects spaces between fields, but robust parsers support them.
# ------------------------------------------------------------------------------

# 2.1 Space-delimited FILE action
CONDUIT ^gfs\.(.*) FILE -overwrite /data/gfs/\1

# 2.2 Space-delimited PIPE action with piped shell command
HDS ^SA.* PIPE -flush sh -c "cat >> /tmp/pipe_output.log"

# 2.3 Space-delimited STDIOFILE action
IDS|DDPLUS ^.* STDIOFILE -flush /tmp/stdio_append.log

# 2.4 Space-delimited DBFILE (with key) and NOOP actions
NEXRAD ^radar_(.*) DBFILE /tmp/legacy_database.dat \1
SPARE ^.* NOOP

# 2.5 Space-delimited EXEC with -wait
ANY ^NOTIFY_SPACE_.* EXEC -wait /usr/local/bin/alert_handler.sh \1


# ------------------------------------------------------------------------------
# SECTION 3: Line Continuation
# Per spec, TAB is either a tab character OR a newline followed by a tab.
# That means an entry can be continued onto the next line simply by starting
# that line with a tab -- no backslash escaping is part of the pqact grammar.
# Any backslash-newline seen inside an action argument is literal text handed
# to the shell/child process, not a pqact continuation mechanism.
# ------------------------------------------------------------------------------

# 3.1 Genuine pqact continuation: newline + tab splitting the action from its
# flags/pathname (no backslashes involved)
ANY	^system_event.*
	EXEC	echo "multiline entry, continued via newline+tab only" > /tmp/exec_native_continuation.out

# 3.2 Genuine pqact continuation splitting flags from pathname across lines
NGRID	^NAM_([0-9]{8})
	PIPE	-flush -close
	/usr/bin/python3 /scripts/decode_nam.py -d /tmp/nam/\1

# 3.3 Backslash-newline retained for comparison: this is NOT a documented
# pqact continuation. If a parser treats it identically to 3.1/3.2, that's
# an extension beyond the spec, not spec compliance -- worth flagging as such.
ANY	^system_event_backslash.*	EXEC	echo "This is a \
	non-standard backslash-continued \
	command execution" > /tmp/exec_backslash.out


# ------------------------------------------------------------------------------
# SECTION 4: Extended Feedtype Expressions & Pattern Edge Cases
# ------------------------------------------------------------------------------

# 4.1 Single feedtype
NEXRAD3	^SDUS[0-9]{2} (....)	FILE	/tmp/radar/\1.dat

# 4.2 Primary feedtype union combinations
IDS|DDPLUS|HDS|NMC2	^[A-Z]{4}	NOOP

# 4.3 Subtract/Exclude feedtypes (e.g., ANY except EXP and SPARE)
ANY-EXP-SPARE	^GLOBAL_.*	FILE	-close /tmp/global.dat

# 4.4 ANY feedtype (the documented catch-all -- NOT "ALL", which is not a
# real LDM feedtype name) with explicit regex capture
ANY	^(FOUS[0-9]{2}) (....) ([0-9]{6})	FILE	-overwrite /data/text/\2/\1_\3.txt

# 4.5 Numeric feedtype (doc example: "3")
3	^TEST_NUMERIC_.*	NOOP


# ------------------------------------------------------------------------------
# SECTION 5: Formatting Edge Cases & Whitespace Resiliency
# ------------------------------------------------------------------------------

# 5.1 Deeply indented lines (leading spaces and tabs)
               ANY      ^indented_space.*    FILE    /tmp/indented_space.txt
	ANY	^indented_tab.*	FILE	/tmp/indented_tab.txt

# 5.2 Mixed spaces and tabs between fields
EXP 	 ^mixed_separators.* 	 PIPE 	 -flush /bin/cat

# 5.3 Empty/blank lines above and below

# 5.4 Trailing whitespace after command parameters
EXP	^trailing_space.*	FILE	/tmp/clean.txt    

# 5.5 Action arguments containing spaces inside double quotes
EXP	^QUOTED_.*	EXEC	/usr/local/bin/logger.sh "Param with spaces" "Second param"

# 5.6 Comment NOT in column 1 (per spec, comments require '#' in column one --
# this line is a negative test: a compliant strict parser should NOT treat
# this as a comment)
   # this hash is indented and is technically not a legal column-1 comment


# ------------------------------------------------------------------------------
# SECTION 6: String Substitution (Data-Product Identifier, Temporal, Time,
# Sequence Number) -- previously untested entirely in pqact2.conf
# ------------------------------------------------------------------------------

# 6.1 Simple single-digit subexpression substitution (baseline, for contrast)
DDS	^SAUS.. .... (..)(..)	FILE	-close saus_\1\2.wmo

# 6.2 Temporal subexpression replacement: (\x:yyyy) (\x:mm) (\x:dd) etc.
# Subexpression 1 is interpreted as a day-of-month field.
WMO	^...... .... ([0-3][0-9])([0-2][0-9]).*/pAGO	FILE	-close data/gempak/nwx/obs/ago/(\1:yyyy)(\1:mm)\1\2.ago

# 6.2b All six documented temporal forms in one entry
WMO	^...... .... ([0-3][0-9])([0-2][0-9]).*/pTEMPORAL	FILE	/tmp/temporal/(\1:yyyy)-(\1:yy)-(\1:mmm)-(\1:mm)-(\1:ddd)-(\1:dd).dat

# 6.3 Creation-time strftime-style substitutions (%Y %m %d %H %M %S %j %% etc.)
ANY	^CREATIONTIME_.*	FILE	-close /tmp/creation/%Y/%m/%d/%H%M%S_%j_%%.dat

# 6.4 Sequence-number substitution: (seq)
ANY	^SEQ_.*	FILE	-close /tmp/seq/product_(seq).dat

# 6.5 Combined: capture group + temporal + strftime + sequence number together
WMO	^...... .... ([0-3][0-9])([0-2][0-9]).*/pCOMBO	PIPE	-flush /usr/local/bin/archive.sh \1\2 (\1:yyyy)(\1:mm)(\1:dd) %H:%M:%S (seq)
